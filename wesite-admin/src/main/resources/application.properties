#thymeleaf
spring.thymeleaf.prefix=classpath:/views/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.resources.chain.strategy.content.enabled=true
spring.resources.chain.strategy.content.paths=/**

spring.messages.basename = i18n/message

spring.mvc.static-path-pattern=/static/**

spring.devtools.restart.enabled=false

spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Enable only after applying doc/alter_issue_center.sql
wesite.diagnostics.enabled=${WESITE_DIAGNOSTICS_ENABLED:false}
wesite.diagnostics.app=admin
wesite.diagnostics.environment=${WESITE_ENVIRONMENT:local}

# Honor forwarded scheme/client address only through Tomcat trusted proxies.
server.forward-headers-strategy=native
