<form class="layui-form" lay-filter="domain-sld-edit-form" style="padding: 20px 30px 0 0;">
  <input type="hidden" name="id">
  <div class="layui-form-item">
    <label class="layui-form-label" for="sld-edit-name">名称</label>
    <div class="layui-input-block"><input id="sld-edit-name" type="text" name="name" lay-verify="required" placeholder="例如 gov.cn" autocomplete="off" class="layui-input"></div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label" for="sld-edit-country">国家/地区</label>
    <div class="layui-input-block"><input id="sld-edit-country" type="text" name="countryName" lay-verify="required" autocomplete="off" class="layui-input"></div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label" for="sld-edit-status">状态</label>
    <div class="layui-input-block"><select id="sld-edit-status" name="status" lay-verify="required"><option value="1">启用</option><option value="2">禁用</option></select></div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label" for="sld-edit-note">备注</label>
    <div class="layui-input-block"><input id="sld-edit-note" type="text" name="note" autocomplete="off" class="layui-input"></div>
  </div>
  <div class="layui-form-item"><div class="layui-input-block"><button type="submit" class="layui-btn" lay-submit lay-filter="domain-sld-edit-submit">保存修改</button></div></div>
</form>
