<form class="layui-form" lay-filter="domain-sld-add-form" style="padding: 20px 30px 0 0;">
  <div class="layui-form-item">
    <label class="layui-form-label" for="sld-add-name">名称</label>
    <div class="layui-input-block"><input id="sld-add-name" type="text" name="name" lay-verify="required" placeholder="例如 gov.cn" autocomplete="off" class="layui-input"></div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label" for="sld-add-country">国家/地区</label>
    <div class="layui-input-block"><input id="sld-add-country" type="text" name="countryName" lay-verify="required" autocomplete="off" class="layui-input"></div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label" for="sld-add-status">状态</label>
    <div class="layui-input-block"><select id="sld-add-status" name="status"><option value="1" selected>启用</option></select></div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label" for="sld-add-note">备注</label>
    <div class="layui-input-block"><input id="sld-add-note" type="text" name="note" autocomplete="off" class="layui-input"></div>
  </div>
  <div class="layui-form-item"><div class="layui-input-block"><button type="submit" class="layui-btn" lay-submit lay-filter="domain-sld-add-submit">保存</button></div></div>
</form>
