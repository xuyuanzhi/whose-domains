<form class="layui-form" lay-filter="domain-tld-edit-form" style="padding: 20px 30px 20px 0;">
  <input type="hidden" name="id">
  <fieldset class="layui-elem-field layui-field-title"><legend>注册管理机构</legend></fieldset>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-org-name">机构名称</label><div class="layui-input-block"><input id="tld-org-name" type="text" name="orgName" lay-verify="required" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-org-addr">地址</label><div class="layui-input-block"><input id="tld-org-addr" type="text" name="orgAddr" lay-verify="required" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-org-addr2">地址补充</label><div class="layui-input-block"><input id="tld-org-addr2" type="text" name="orgAddr2" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-org-country">国家/地区</label><div class="layui-input-block"><input id="tld-org-country" type="text" name="orgCountry" lay-verify="required" autocomplete="off" class="layui-input"></div></div>

  <fieldset class="layui-elem-field layui-field-title"><legend>管理联系人</legend></fieldset>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-admin-name">姓名</label><div class="layui-input-block"><input id="tld-admin-name" type="text" name="adminName" lay-verify="required" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-admin-org">所在机构</label><div class="layui-input-block"><input id="tld-admin-org" type="text" name="adminOrg" lay-verify="required" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-admin-addr">地址</label><div class="layui-input-block"><input id="tld-admin-addr" type="text" name="adminAddr" lay-verify="required" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-admin-addr2">地址补充</label><div class="layui-input-block"><input id="tld-admin-addr2" type="text" name="adminAddr2" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-admin-country">国家/地区</label><div class="layui-input-block"><input id="tld-admin-country" type="text" name="adminCountry" lay-verify="required" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-admin-email">邮箱</label><div class="layui-input-block"><input id="tld-admin-email" type="email" name="adminEmail" lay-verify="required|email" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-admin-phone">电话</label><div class="layui-input-block"><input id="tld-admin-phone" type="text" name="adminPhone" lay-verify="required" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-admin-fax">传真</label><div class="layui-input-block"><input id="tld-admin-fax" type="text" name="adminFax" autocomplete="off" class="layui-input"></div></div>

  <fieldset class="layui-elem-field layui-field-title"><legend>技术联系人</legend></fieldset>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-tech-name">姓名</label><div class="layui-input-block"><input id="tld-tech-name" type="text" name="techName" lay-verify="required" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-tech-org">所在机构</label><div class="layui-input-block"><input id="tld-tech-org" type="text" name="techOrg" lay-verify="required" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-tech-addr">地址</label><div class="layui-input-block"><input id="tld-tech-addr" type="text" name="techAddr" lay-verify="required" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-tech-addr2">地址补充</label><div class="layui-input-block"><input id="tld-tech-addr2" type="text" name="techAddr2" autocomplete="off" class="layui-input"></div></div>

  <div class="layui-form-item"><label class="layui-form-label" for="tld-tech-email">邮箱</label><div class="layui-input-block"><input id="tld-tech-email" type="email" name="techEmail" lay-verify="required|email" autocomplete="off" class="layui-input"></div></div>

  <div class="layui-form-item"><label class="layui-form-label" for="tld-tech-fax">传真</label><div class="layui-input-block"><input id="tld-tech-fax" type="text" name="techFax" autocomplete="off" class="layui-input"></div></div>
  <div class="layui-form-item"><label class="layui-form-label" for="tld-status">状态</label><div class="layui-input-block"><select id="tld-status" name="status"><option value="1">启用</option><option value="2">禁用</option></select></div></div>
  <div class="layui-form-item"><div class="layui-input-block"><button type="submit" class="layui-btn" lay-submit lay-filter="domain-tld-edit-submit">保存修改</button></div></div>
