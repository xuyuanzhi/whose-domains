<form class="layui-form" lay-filter="person-edit-form" style="padding: 20px 30px 0 0;">
  <input type="hidden" name="id">
  <div class="layui-form-item">
    <label class="layui-form-label" for="person-edit-name">用户名称</label>
    <div class="layui-input-block">
      <input id="person-edit-name" type="text" name="name" maxlength="100" lay-verify="required" placeholder="请输入用户名称" autocomplete="off" class="layui-input">
    </div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label" for="person-edit-phone">手机号码</label>
    <div class="layui-input-block">
      <input id="person-edit-phone" type="text" name="phoneNo" maxlength="32" lay-verify="required" placeholder="请输入手机号码" autocomplete="off" class="layui-input">
    </div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label" for="person-edit-status">状态</label>
    <div class="layui-input-block">
      <select id="person-edit-status" name="status" lay-verify="required">
        <option value="1">启用</option>
        <option value="2">禁用</option>
      </select>
    </div>
  </div>
  <div class="layui-form-item">
    <div class="layui-input-block">
      <button type="submit" class="layui-btn" lay-submit lay-filter="person-edit-submit">保存修改</button>
    </div>
  </div>
</form>
