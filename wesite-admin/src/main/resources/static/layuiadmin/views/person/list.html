<title>用户管理</title>

<div class="layui-card layadmin-header">
  <div class="layui-breadcrumb" lay-filter="breadcrumb">
    <a lay-href="">主页</a>
    <a><cite>用户管理</cite></a>
  </div>
</div>

<div class="layui-fluid">
  <div class="layui-card">
    <div class="layui-form layui-card-header layuiadmin-card-header-auto" lay-filter="person-list-form">
      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label" for="person-keyword">关键词</label>
          <div class="layui-input-inline">
            <input id="person-keyword" type="text" name="keyword" placeholder="用户名称或手机号码" autocomplete="off" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <button type="submit" class="layui-btn" lay-submit lay-filter="person-list-search">
            <i class="layui-icon layui-icon-search"></i> 查询
          </button>
        </div>
      </div>
    </div>

    <div class="layui-card-body">
      <table id="LAY-user-manage" lay-filter="LAY-user-manage"></table>
    </div>
  </div>
</div>

<script type="text/html" id="person-list-toolbar">
  <button type="button" class="layui-btn layui-btn-sm" lay-event="add">
    <i class="layui-icon layui-icon-addition"></i> 新增用户
  </button>
</script>

<script type="text/html" id="person-row-actions">
  <button type="button" class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit">
    <i class="layui-icon layui-icon-edit"></i> 编辑
  </button>
  <button type="button" class="layui-btn layui-btn-danger layui-btn-xs" lay-event="delete">
    <i class="layui-icon layui-icon-delete"></i> 删除
  </button>
</script>

<script>
layui.use(['admin', 'table', 'form', 'util'], function(){
  var $ = layui.$;
  var admin = layui.admin;
  var table = layui.table;
  var form = layui.form;
  var view = layui.view;
  var activePopupIndex = null;

  function safeText(value) {
    return layui.util.escape(value == null ? '' : String(value));
  }

  function setBusy(button, busy) {
    button.data('busy', busy);
    button.prop('disabled', busy).toggleClass('layui-disabled', busy);
  }

  function reloadUsers() {
    table.reload('LAY-user-manage');
  }

  function editablePayload(field) {
    var payload = {
      name: $.trim(field.name || ''),
      phoneNo: $.trim(field.phoneNo || ''),
      status: Number(field.status)
    };
    if (field.id) {
      payload.id = field.id;
    }
    return payload;
  }

  function savePerson(field, button) {
    if (button.data('busy')) {
      return false;
    }
    setBusy(button, true);
    admin.req({
      type: 'post',
      url: '/user/save',
      contentType: 'application/json;charset=UTF-8',
      data: JSON.stringify(editablePayload(field)),
      success: function(response) {
        if (response && response.code === 0) {
          layer.msg('用户已保存');
          if (activePopupIndex !== null) {
            layer.close(activePopupIndex);
            activePopupIndex = null;
          }
          reloadUsers();
        } else {
          layer.msg((response && response.msg) || '保存失败');
        }
      },
      complete: function() {
        setBusy(button, false);
      }
    });
    return false;
  }

  function openAdd() {
    admin.popup({
      title: '新增用户',
      area: ['520px', '360px'],
      id: 'person-add-popup',
      success: function(layero, index) {
        activePopupIndex = index;
        view(this.id).render('person/add').done(function() {
          form.render(null, 'person-add-form');
        });
      },
      end: function() {
        activePopupIndex = null;
      }
    });
  }

  function openEdit(data, button) {
    if (button.data('busy')) {
      return;
    }
    setBusy(button, true);
    admin.req({
      type: 'post',
      url: '/user/detail',
      contentType: 'application/json;charset=UTF-8',
      data: JSON.stringify({id: data.id}),
      success: function(response) {
        if (!response || response.code !== 0 || !response.data) {
          layer.msg((response && response.msg) || '用户详情加载失败');
          return;
        }
        var detail = response.data;
        admin.popup({
          title: '编辑用户',
          area: ['520px', '360px'],
          id: 'person-edit-popup',
          success: function(layero, index) {
            activePopupIndex = index;
            view(this.id).render('person/edit').done(function() {
              form.val('person-edit-form', {
                id: detail.id || '',
                name: detail.name || '',
                phoneNo: detail.phoneNo || '',
                status: String(detail.status)
              });
              form.render(null, 'person-edit-form');
            });
          },
          end: function() {
            activePopupIndex = null;
          }
        });
      },
      complete: function() {
        setBusy(button, false);
      }
    });
  }

  function deletePerson(data, button) {
    if (button.data('busy')) {
      return;
    }
    setBusy(button, true);
    layer.confirm('确认删除用户“' + safeText(data.name) + '”吗？', function(index) {
      layer.close(index);
      admin.req({
        type: 'post',
        url: '/user/delete',
        contentType: 'application/json;charset=UTF-8',
        data: JSON.stringify({id: data.id}),
        success: function(response) {
          if (response && response.code === 0) {
            layer.msg('用户已删除');
            reloadUsers();
          } else {
            layer.msg((response && response.msg) || '删除失败');
          }
        },
        complete: function() {
          setBusy(button, false);
        }
      });
    }, function() {
      setBusy(button, false);
    });
  }

  form.render(null, 'person-list-form');

  table.render({
    elem: '#LAY-user-manage',
    id: 'LAY-user-manage',
    url: '/user/list',
    method: 'post',
    contentType: 'application/json;charset=UTF-8',
    toolbar: '#person-list-toolbar',
    page: true,
    limit: 20,
    limits: [20, 50, 100],
    height: 'full-285',
    text: {none: '暂无用户'},
    cols: [[
      {type: 'numbers', title: '序号', width: 70, fixed: 'left'},
      {field: 'name', title: '用户名称', minWidth: 160, templet: function(data) {
        return safeText(data.name);
      }},
      {field: 'phoneNo', title: '手机号码', width: 160, templet: function(data) {
        return safeText(data.phoneNo);
      }},
      {field: 'statusText', title: '状态', width: 100, templet: function(data) {
        return safeText(data.statusText);
      }},
      {field: 'createTimeText', title: '创建时间', width: 180, templet: function(data) {
        return safeText(data.createTimeText);
      }},
      {field: 'updateTimeText', title: '更新时间', width: 180, templet: function(data) {
        return safeText(data.updateTimeText);
      }},
      {title: '操作', width: 150, align: 'center', fixed: 'right', toolbar: '#person-row-actions'}
    ]]
  });

  form.on('submit(person-list-search)', function(data) {
    table.reload('LAY-user-manage', {page: {curr: 1}, where: {keyword: $.trim(data.field.keyword || '')}});
    return false;
  });

  form.on('submit(person-add-submit)', function(data) {
    return savePerson(data.field, $(data.elem));
  });

  form.on('submit(person-edit-submit)', function(data) {
    return savePerson(data.field, $(data.elem));
  });

  table.on('toolbar(LAY-user-manage)', function(obj) {
    if (obj.event === 'add') {
      openAdd();
    }
  });

  table.on('tool(LAY-user-manage)', function(obj) {
    var button = obj.tr.find('[lay-event="' + obj.event + '"]');
    if (obj.event === 'edit') {
      openEdit(obj.data, button);
    } else if (obj.event === 'delete') {
      deletePerson(obj.data, button);
    }
  });
});
</script>
