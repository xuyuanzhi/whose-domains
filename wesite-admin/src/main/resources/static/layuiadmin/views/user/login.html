<title>管理员登录</title>
<style>
.admin-visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
</style>
<div class="layadmin-user-login" id="LAY-user-login">
  <div class="layadmin-user-login-main">
    <div class="layadmin-user-login-box layadmin-user-login-header">
      <h2>Whose.Domains Admin</h2>
      <p>管理员控制台</p>
    </div>
    <form class="layui-form layadmin-user-login-box layadmin-user-login-body" lay-filter="admin-login-submit">
      <div class="layui-form-item">
        <label class="layui-form-label admin-visually-hidden" for="admin-login-username">管理员账号</label>
        <i class="layui-icon layui-icon-username layadmin-user-login-icon"></i>
        <input id="admin-login-username" type="text" name="username" required lay-verify="required" autocomplete="username" placeholder="管理员账号" class="layui-input">
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label admin-visually-hidden" for="admin-login-password">密码</label>
        <i class="layui-icon layui-icon-password layadmin-user-login-icon"></i>
        <input id="admin-login-password" type="password" name="password" required lay-verify="required" autocomplete="current-password" placeholder="密码" class="layui-input">
        <button class="layui-btn layui-btn-primary layui-btn-sm" type="button" aria-controls="admin-login-password" aria-label="显示密码" id="admin-login-password-toggle" style="position:absolute;right:4px;top:3px;">显示</button>
      </div>
      <div class="layui-form-item">
        <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="admin-login-submit" type="submit">登录</button>
      </div>
    </form>
  </div>
</div>

<script>
layui.use(['admin', 'form', 'setter'], function(){
  var $ = layui.$;
  var admin = layui.admin;
  var form = layui.form;
  var setter = layui.setter;
  var password = $('#admin-login-password');
  var toggle = $('#admin-login-password-toggle');

  function decodeRedirect(value) {
    try {
      return decodeURIComponent(value || '');
    } catch (error) {
      return '';
    }
  }

  function safeRedirect(value) {
    return /^\/(?!\/)/.test(value || '') ? value : '/';
  }

  function setBusy(button, busy) {
    button.prop('disabled', busy).toggleClass('layui-btn-disabled', busy);
  }

  toggle.on('click', function(){
    var shown = password.attr('type') === 'text';
    password.attr('type', shown ? 'password' : 'text');
    toggle.text(shown ? '显示' : '隐藏').attr('aria-label', shown ? '显示密码' : '隐藏密码');
  });

  form.on('submit(admin-login-submit)', function(data){
    var button = $(data.elem);
    var field = data.field;
    setBusy(button, true);
    admin.req({
      url: '/login',
      type: 'post',
      contentType: 'application/json',
      data: JSON.stringify(field),
      success: function(response){
        if (response.code === 0 && response.data && response.data.token) {
          layui.data(setter.tableName, { key: setter.request.tokenName, value: response.data.token });
          location.hash = safeRedirect(decodeRedirect((layui.router().params || {}).redirect));
        } else {
          layer.msg(response.msg || '登录失败');
        }
      },
      complete: function(){
        setBusy(button, false);
      }
    });
    return false;
  });
});
</script>
