<style>
  .blog-editor-layout [hidden] { display: none !important; }
  .blog-editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, .8fr); gap: 18px; padding: 18px; }
  .blog-editor-panel { min-width: 0; }
  .blog-editor-panel h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  .blog-editor-panel .layui-form-label { width: 96px; }
  .blog-editor-panel .layui-input-block { margin-left: 126px; }
  #blog-content { min-height: 360px; resize: vertical; font-family: Consolas, Monaco, monospace; line-height: 1.55; }
  #blog-preview { display: block; width: 100%; min-height: 620px; border: 1px solid #e6e6e6; background: #fff; }
  .blog-editor-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 18px; }
  .blog-assist-field { display: block; margin: 12px 0 6px; }
  #blog-proposal { border: 1px solid #ddd; padding: 12px; margin: 16px 0; }
  #blog-proposal-preview { width: 100%; min-height: 360px; border: 1px solid #ddd; background: #fff; }
  .blog-editor-note { margin: -6px 0 14px 126px; color: #999; }
  @media (max-width: 980px) {
    .blog-editor-layout { grid-template-columns: 1fr; }
    #blog-preview { min-height: 420px; }
  }
</style>

<div class="blog-editor-layout">
  <section class="blog-editor-panel" aria-labelledby="blog-fields-heading">
    <h3 id="blog-fields-heading">文章内容</h3>
    <form id="blog-editor-form" class="layui-form" lay-filter="blog-editor-form">
      <input type="hidden" id="blog-id" name="id">
      <div class="layui-form-item">
        <label class="layui-form-label" for="blog-title">标题</label>
        <div class="layui-input-block">
          <input class="layui-input" id="blog-title" name="title" maxlength="300" autocomplete="off">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label" for="blog-slug">Slug</label>
        <div class="layui-input-block">
          <input class="layui-input" id="blog-slug" name="slug" maxlength="200" autocomplete="off">
        </div>
      </div>
      <p class="blog-editor-note">文章发布后 Slug 不可修改，避免已有链接失效。</p>
      <div class="layui-form-item layui-form-text">
        <label class="layui-form-label" for="blog-summary">摘要</label>
        <div class="layui-input-block">
          <textarea class="layui-textarea" id="blog-summary" name="summary" maxlength="600"></textarea>
        </div>
      </div>
      <div class="layui-form-item layui-form-text">
        <label class="layui-form-label" for="blog-content">正文 HTML</label>
        <div class="layui-input-block">
          <textarea class="layui-textarea" id="blog-content" name="content" spellcheck="false"></textarea>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label" for="blog-author">作者</label>
        <div class="layui-input-block">
          <input class="layui-input" id="blog-author" name="author" maxlength="100" autocomplete="off" placeholder="Whose.Domains">
          <div class="layui-form-mid layui-word-aux">AI 文章默认署名 Whose.Domains；仅在真人实质性改写并核实内容后填写真实姓名，请勿使用虚构笔名。留空时公开页面显示站点署名。</div>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label" for="blog-category">分类</label>
        <div class="layui-input-block">
          <input class="layui-input" id="blog-category" name="category" maxlength="100" autocomplete="off">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label" for="blog-tags">标签</label>
        <div class="layui-input-block">
          <input class="layui-input" id="blog-tags" name="tags" maxlength="300" placeholder="使用英文逗号分隔" autocomplete="off">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label" for="blog-meta-title">Meta 标题</label>
        <div class="layui-input-block">
          <input class="layui-input" id="blog-meta-title" name="metaTitle" maxlength="300" autocomplete="off">
        </div>
      </div>
      <div class="layui-form-item layui-form-text">
        <label class="layui-form-label" for="blog-meta-description">Meta 描述</label>
        <div class="layui-input-block">
          <textarea class="layui-textarea" id="blog-meta-description" name="metaDescription" maxlength="600"></textarea>
        </div>
      </div>
    </form>
  </section>

  <section class="blog-editor-panel" aria-labelledby="blog-preview-heading">
    <h3>发布前审查</h3>
    <div id="blog-review" role="status" aria-live="polite" style="margin-bottom:20px; white-space:pre-wrap; line-height:1.8;">检查当前编辑内容的重复情况、参考来源、操作示例和适用限制。自动检查不能代替人工核实事实。</div>
    <div id="blog-assist-controls">
      <h3 id="blog-optimize-heading" tabindex="-1">文章优化</h3>
      <label class="blog-assist-field" for="blog-optimize-focus">优化要求（可选）</label>
      <textarea id="blog-optimize-focus" class="layui-textarea" maxlength="1000" placeholder="例如：保留现有案例，补充排查步骤和适用限制"></textarea>
      <label class="blog-assist-field" for="blog-optimize-references">参考资料（可选）</label>
      <textarea id="blog-optimize-references" class="layui-textarea" maxlength="6000" placeholder="填写已核实的来源链接及相关摘录；AI 不会自动打开链接或验证事实"></textarea>
      <p id="blog-optimize-state" role="status" aria-live="polite" style="margin:12px 0;">一键优化会将当前文章及所填资料发送给已配置的 AI 服务，生成待确认稿。</p>
      <button type="button" id="blog-optimize-button" class="layui-btn layui-btn-normal blog-editor-action">一键优化</button>
      <button type="button" id="blog-resume-optimization" class="layui-btn layui-btn-primary blog-editor-action" hidden>恢复查看</button>
    </div>
    <div id="blog-proposal" hidden>
      <h3>优化稿 · 尚未保存</h3>
      <div id="blog-proposal-summary" style="white-space:pre-wrap;line-height:1.8;"></div>
      <iframe id="blog-proposal-preview" sandbox title="优化稿安全预览"></iframe>
      <button type="button" id="blog-apply-proposal" class="layui-btn blog-editor-action">应用到编辑区</button>
      <button type="button" id="blog-discard-proposal" class="layui-btn layui-btn-primary blog-editor-action">放弃优化稿</button>
      <p>应用后仍需保存；请核实来源、事实和示例。保存时会保留 AI 辅助标记。</p>
    </div>
    <h3 id="blog-preview-heading">安全预览</h3>
    <iframe id="blog-preview" sandbox title="博客文章预览"></iframe>
  </section>
</div>

<div class="blog-editor-actions">
  <button type="button" class="layui-btn layui-btn-primary blog-editor-action" id="blog-preview-button">更新预览</button>
  <button type="button" class="layui-btn layui-btn-primary blog-editor-action" id="blog-review-button">检查重复与质量</button>
  <button type="button" class="layui-btn layui-btn-normal blog-editor-action" id="blog-save-button">保存草稿</button>
  <button type="button" class="layui-btn blog-editor-action" id="blog-publish-button">保存并发布</button>
</div>

<script>
layui.use(['admin', 'form'], function(){
  var $ = layui.$;
  var admin = layui.admin;
  var form = layui.form;
  var pendingRequests = 0;
  var afterSave = null;
  var aiAssisted = false;
  var optimization = null;
  var optimizing = false;
  var editorGeneration = 0;
  var reviewOnLoad = false;
  var focusOptimization = false;
  var optimizationEnabled = true;
  var editorRoot = document.getElementById('blog-editor-form');
  function isCurrentEditor() {
    return editorRoot && document.getElementById('blog-editor-form') === editorRoot;
  }
  // Every callback belongs to this DOM instance and the article it was started for.
  function editorRequest(options) {
    var generation = editorGeneration;
    ['done', 'complete'].forEach(function(key) {
      var callback = options[key];
      if (callback) options[key] = function() {
        if (isCurrentEditor() && generation === editorGeneration) callback.apply(this, arguments);
      };
    });
    admin.req(options);
  }

  function setEditorBusy(busy) {
    pendingRequests = Math.max(0, pendingRequests + (busy ? 1 : -1));
    busy = pendingRequests > 0;
    $('.blog-editor-action')
      .prop('disabled', busy)
      .attr('aria-busy', String(busy))
      .toggleClass('layui-disabled', busy);
    updateOptimizationButton();
  }

  function updateOptimizationButton() {
    var disabled = pendingRequests > 0 || !optimizationEnabled;
    $('#blog-optimize-button').prop('disabled', disabled).toggleClass('layui-disabled', disabled);
  }

  function loadCapabilities() {
    optimizationEnabled = false;
    updateOptimizationButton();
    $('#blog-optimize-state').text('正在检查 AI 服务配置…');
    var delivered = false;
    editorRequest({ type: 'post', url: '/blog/assist/capabilities', contentType: 'application/json;charset=UTF-8', data: '{}',
      done: function(resp) {
        delivered = true;
        optimizationEnabled = resp.data.optimizationEnabled === true;
        $('#blog-optimize-state').text(optimizationEnabled
          ? '一键优化会将当前文章及所填资料发送给已配置的 AI 服务，生成待确认稿。'
          : '尚未启用文章优化：请为 Admin 配置 DEEPSEEK_API_KEY 并重启服务。质量检查和文章编辑仍可使用。');
        updateOptimizationButton();
      },
      complete: function() {
        if (!delivered) $('#blog-optimize-state').text('无法获取 AI 配置状态，请重新打开编辑器后重试。质量检查和文章编辑仍可使用。');
      }
    });
  }

  function collectFields() {
    return {
      id: $('#blog-id').val(),
      slug: $('#blog-slug').val(),
      title: $('#blog-title').val(),
      summary: $('#blog-summary').val(),
      content: $('#blog-content').val(),
      author: $('#blog-author').val(),
      category: $('#blog-category').val(),
      tags: $('#blog-tags').val(),
      metaTitle: $('#blog-meta-title').val(),
      metaDescription: $('#blog-meta-description').val(),
      aiAssisted: aiAssisted
    };
  }

  function fillEditor(detail) {
    $('#blog-id').val(detail.id || '');
    $('#blog-slug').val(detail.slug || '');
    $('#blog-title').val(detail.title || '');
    $('#blog-summary').val(detail.summary || '');
    $('#blog-content').val(detail.content || '');
    $('#blog-author').val(detail.author || '');
    $('#blog-category').val(detail.category || '');
    $('#blog-tags').val(detail.tags || '');
    $('#blog-meta-title').val(detail.metaTitle || '');
    $('#blog-meta-description').val(detail.metaDescription || '');
    var archived = detail.status === 2;
    aiAssisted = false; // Existing persisted provenance is preserved by the server.
    $('#blog-assist-controls').toggle(!archived);
    $('#blog-proposal').prop('hidden', true);
    optimization = null;
    $('#blog-editor-form :input').prop('disabled', archived);
    $('#blog-slug').prop('readonly', detail.status === 1);
    $('#blog-publish-button').toggle(detail.status === 0);
    $('#blog-save-button').toggle(!archived);
    $('#blog-review-button').toggle(!archived);
    $('#blog-review').text(archived ? '已归档：原文仅供查看。如需修改，请先在列表中恢复为草稿。' : '请检查当前内容并核实来源。');
    form.render(null, 'blog-editor-form');
  }

  function previewBlog() {
    setEditorBusy(true);
    editorRequest({
      type: 'post',
      url: '/blog/preview',
      contentType: 'application/json;charset=UTF-8',
      data: JSON.stringify({content: $('#blog-content').val()}),
      done: function(resp) {
        document.getElementById('blog-preview').srcdoc = resp.data.html;
      },
      complete: function() {
        setEditorBusy(false);
      }
    });
  }

  function saveBlog(done) {
    setEditorBusy(true);
    editorRequest({
      type: 'post',
      url: '/blog/save',
      contentType: 'application/json;charset=UTF-8',
      data: JSON.stringify(collectFields()),
      done: function() {
        layer.msg('文章已保存');
        if (typeof done === 'function') {
          done();
        }
        if (typeof afterSave === 'function') {
          afterSave();
        }
      },
      complete: function() {
        setEditorBusy(false);
      }
    });
  }

  function reviewBlog(done) {
    setEditorBusy(true);
    editorRequest({
      type: 'post',
      url: '/blog/review',
      contentType: 'application/json;charset=UTF-8',
      data: JSON.stringify(collectFields()),
      done: function(resp) {
        var report = resp.data;
        var lines = ['正文说明词数：' + report.wordCount];
        (report.blockers || []).forEach(function(issue) { lines.push('需修改：' + issue.message); });
        (report.warnings || []).forEach(function(issue) { lines.push('需核实：' + issue.message); });
        (report.matches || []).forEach(function(match) {
          lines.push('相关文章：' + match.title + ' [ID: ' + match.id + ', ' + match.kind + ', /blog/' + match.slug + ']');
        });
        if (reviewPassed(report)) lines.unshift('自动检查通过，请继续人工核实事实、引用和示例。');
        // Report fields originate in article text; never render them as HTML.
        $('#blog-review').text(lines.join('\n'));
        if (typeof done === 'function') done(report);
      },
      complete: function() { setEditorBusy(false); }
    });
  }

  function reviewPassed(report) {
    return report.publishable === true || report.isPublishable === true;
  }

  function finishOptimization() {
    if (optimizing) { optimizing = false; setEditorBusy(false); }
  }

  function showOptimization(job, generation, source) {
    if (!isCurrentEditor() || generation !== editorGeneration) return;
    $('#blog-optimize-state').text(job.message || '正在处理');
    if (job.status === 'RUNNING') {
      setTimeout(function() {
        if (!isCurrentEditor() || generation !== editorGeneration) return;
        var delivered = false;
        editorRequest({ type: 'post', url: '/blog/assist/job', contentType: 'application/json;charset=UTF-8',
          data: JSON.stringify({ id: job.id }),
          done: function(resp) { delivered = true; showOptimization(resp.data, generation, source); },
          complete: function() {
            if (!delivered && generation === editorGeneration) {
              $('#blog-optimize-state').text('任务状态获取失败，可点击“恢复查看”继续获取结果。');
              $('#blog-resume-optimization').prop('hidden', false);
              finishOptimization();
            }
          }
        });
      }, 1500);
      return;
    }
    finishOptimization();
    if (job.status !== 'SUCCEEDED') return;
    optimization = { source: source, proposal: job.result };
    var result = job.result;
    var before = result.before.blockers || [], after = result.after.blockers || [];
    var lines = ['标题：' + result.article.title,
      '正文说明词数：' + result.before.wordCount + ' → ' + result.after.wordCount,
      '规则阻断项：' + before.length + ' → ' + after.length, result.notes];
    after.forEach(function(issue) { lines.push('仍需修改：' + issue.message); });
    (result.after.matches || []).forEach(function(match) { lines.push('相关文章：' + match.title + '（' + match.kind + '）'); });
    lines.push('新引用及事实尚未自动核实。');
    $('#blog-proposal-summary').text(lines.join('\n'));
    document.getElementById('blog-proposal-preview').srcdoc = result.article.content;
    $('#blog-proposal').prop('hidden', false);
  }

  var pendingOptimization = null;
  $('#blog-optimize-button').on('click', function() {
    if (optimizing || pendingRequests > 0 || !optimizationEnabled) return;
    var source = JSON.stringify(collectFields());
    var generation = editorGeneration;
    optimizing = true; setEditorBusy(true);
    $('#blog-proposal').prop('hidden', true);
    $('#blog-resume-optimization').prop('hidden', true);
    $('#blog-optimize-state').text('正在提交优化任务…');
    var delivered = false;
    editorRequest({ type: 'post', url: '/blog/assist/optimize', contentType: 'application/json;charset=UTF-8',
      data: JSON.stringify({article: JSON.parse(source), focus: $('#blog-optimize-focus').val(), references: $('#blog-optimize-references').val()}),
      done: function(resp) {
        delivered = true;
        pendingOptimization = { id: resp.data.id, generation: generation, source: source };
        showOptimization(resp.data, generation, source);
      },
      complete: function() {
        if (!delivered && generation === editorGeneration) {
          $('#blog-optimize-state').text('优化任务未成功提交，请根据错误提示检查 AI 配置或稍后重试。');
          finishOptimization();
        }
      }
    });
  });

  $('#blog-resume-optimization').on('click', function() {
    if (!pendingOptimization || optimizing) return;
    optimizing = true; setEditorBusy(true);
    $('#blog-resume-optimization').prop('hidden', true);
    showOptimization({id: pendingOptimization.id, status: 'RUNNING', message: '正在恢复任务状态'},
      pendingOptimization.generation, pendingOptimization.source);
  });

  $('#blog-apply-proposal').on('click', function() {
    if (!optimization) return;
    if (JSON.stringify(collectFields()) !== optimization.source) {
      layer.msg('生成期间原文已修改，请基于当前内容重新优化，避免覆盖修改。'); return;
    }
    var candidate = optimization.proposal.article;
    $('#blog-title').val(candidate.title);
    $('#blog-summary').val(candidate.summary);
    $('#blog-content').val(candidate.content);
    $('#blog-meta-title').val(candidate.metaTitle);
    $('#blog-meta-description').val(candidate.metaDescription);
    aiAssisted = true;
    optimization = null;
    $('#blog-proposal').prop('hidden', true);
    $('#blog-review').text('已应用优化稿，尚未保存。请检查并核实后保存。');
    previewBlog();
  });
  $('#blog-discard-proposal').on('click', function() { optimization = null; $('#blog-proposal').prop('hidden', true); });

  function publishBlog() {
    setEditorBusy(true);
    editorRequest({
      type: 'post',
      url: '/blog/publish',
      contentType: 'application/json;charset=UTF-8',
      data: JSON.stringify({id: $('#blog-id').val()}),
      done: function() {
        layer.msg('文章已发布');
        $('#blog-slug').prop('readonly', true);
        $('#blog-publish-button').hide();
        if (typeof afterSave === 'function') {
          afterSave();
        }
      },
      complete: function() {
        setEditorBusy(false);
      }
    });
  }

  function loadBlog(id) {
    setEditorBusy(true);
    editorRequest({
      type: 'post',
      url: '/blog/detail',
      contentType: 'application/json;charset=UTF-8',
      data: JSON.stringify({id: id}),
      done: function(resp) {
        fillEditor(resp.data);
        previewBlog();
        if (resp.data.status !== 2) {
          loadCapabilities();
          if (focusOptimization) document.getElementById('blog-optimize-heading').focus();
        }
        if (reviewOnLoad) { reviewOnLoad = false; reviewBlog(); }
      },
      complete: function() {
        setEditorBusy(false);
      }
    });
  }

  $('#blog-preview-button').on('click', previewBlog);
  $('#blog-review-button').on('click', function() { reviewBlog(); });
  $('#blog-editor-form input, #blog-editor-form textarea').on('input', function() {
    $('#blog-review').text('内容已修改，请重新检查。');
  });
  $('#blog-save-button').on('click', function() {
    saveBlog();
  });
  $('#blog-publish-button').on('click', function() {
    reviewBlog(function(report) {
      if (!reviewPassed(report)) return;
      layer.confirm('保存当前修改并发布文章？请先核实参考来源支持结论、示例可复现，且本文没有重复选题。', function(index) {
        layer.close(index);
        saveBlog(function() {
          publishBlog();
        });
      });
    });
  });

  layui.blogEditor = {
    init: function(id, savedCallback, checkImmediately, optimizeImmediately) {
      editorGeneration++;
      finishOptimization();
      pendingOptimization = null;
      reviewOnLoad = !!checkImmediately;
      focusOptimization = !!optimizeImmediately;
      afterSave = savedCallback;
      loadBlog(id);
    }
  };
});
</script>
