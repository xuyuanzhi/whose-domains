<title>工作台</title>

<style>
.dashboard {
  --dashboard-navy: #17365d;
  --dashboard-teal: #168f8b;
  --dashboard-ink: #202834;
  --dashboard-muted: #727b88;
  --dashboard-line: #e7ebf0;
}
.dashboard-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 18px;
  padding: 26px 30px;
  border-left: 5px solid var(--dashboard-teal);
  background: #fff;
  box-shadow: 0 5px 18px rgba(23, 54, 93, .07);
}
.dashboard-hero__eyebrow {
  margin-bottom: 6px;
  color: var(--dashboard-teal);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
}
.dashboard-hero h1 {
  margin: 0;
  color: var(--dashboard-navy);
  font-size: 26px;
  font-weight: 650;
  line-height: 1.3;
}
.dashboard-hero p {
  max-width: 620px;
  margin: 8px 0 0;
  color: var(--dashboard-muted);
  line-height: 1.7;
}
.dashboard-hero__date { flex: 0 0 auto; color: var(--dashboard-muted); font-size: 13px; }
.dashboard-metrics {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.dashboard-metric {
  position: relative;
  min-width: 0;
  padding: 18px 18px 16px;
  border: 1px solid var(--dashboard-line);
  background: #fff;
}
.dashboard-metric::before {
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 3px;
  content: '';
  background: var(--dashboard-navy);
}
.dashboard-metric--attention::before { background: #d98d20; }
.dashboard-metric--success::before { background: var(--dashboard-teal); }
.dashboard-metric__label {
  overflow: hidden;
  color: var(--dashboard-muted);
  font-size: 13px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dashboard-metric__value {
  margin-top: 10px;
  color: var(--dashboard-ink);
  font-size: 29px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(300px, .7fr);
  gap: 18px;
}
.dashboard-card { border: 1px solid var(--dashboard-line); background: #fff; }
.dashboard-card + .dashboard-card { margin-top: 18px; }
.dashboard-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 54px;
  padding: 0 20px;
  border-bottom: 1px solid var(--dashboard-line);
}
.dashboard-card__header h2 {
  margin: 0;
  color: var(--dashboard-navy);
  font-size: 16px;
  font-weight: 650;
}
.dashboard-card__link { color: var(--dashboard-teal); font-size: 13px; }
.dashboard-list { padding: 4px 20px; }
.dashboard-list__item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #f0f2f5;
}
.dashboard-list__item:last-child { border-bottom: 0; }
.dashboard-list__title {
  overflow: hidden;
  color: var(--dashboard-ink);
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dashboard-list__meta {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 6px;
  color: var(--dashboard-muted);
  font-size: 12px;
}
.dashboard-status {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 0 8px;
  border-radius: 11px;
  background: #eef2f7;
  color: #5e6875;
  font-size: 12px;
}
.dashboard-status--active { background: #e7f5f3; color: #11746f; }
.dashboard-status--attention { background: #fff2df; color: #9b5a00; }
.dashboard-empty { padding: 32px 20px; color: var(--dashboard-muted); text-align: center; }
.dashboard-quick { padding: 10px 20px 18px; }
.dashboard-quick__link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 4px;
  border-bottom: 1px solid #f0f2f5;
  color: var(--dashboard-ink);
  cursor: pointer;
}
.dashboard-quick__link:last-child { border-bottom: 0; }
.dashboard-quick__link:hover,
.dashboard-quick__link:focus { color: var(--dashboard-teal); }
.dashboard-quick__icon {
  display: inline-flex;
  width: 34px;
  height: 34px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #edf2f8;
  color: var(--dashboard-navy);
}
.dashboard-attention {
  padding: 20px;
  border-left: 4px solid #d98d20;
  background: #fffaf2;
}
.dashboard-attention__count { color: #9b5a00; font-size: 28px; font-weight: 650; }
.dashboard-attention p { margin: 6px 0 14px; color: #715e42; line-height: 1.6; }
.dashboard-state {
  margin-bottom: 18px;
  padding: 16px 20px;
  border: 1px solid var(--dashboard-line);
  background: #fff;
  color: var(--dashboard-muted);
}
.dashboard-state--error { border-color: #f0c7c7; background: #fff7f7; color: #8d2e2e; }
@media (max-width: 1260px) {
  .dashboard-metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .dashboard-grid { grid-template-columns: 1fr; }
  .dashboard-hero { align-items: flex-start; flex-direction: column; padding: 22px; }
}
@media (max-width: 560px) {
  .dashboard-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dashboard-list__item { grid-template-columns: 1fr; gap: 8px; }
}
</style>

<div class="layui-fluid dashboard">
  <header class="dashboard-hero">
    <div>
      <div class="dashboard-hero__eyebrow">WHOSE.DOMAINS ADMIN</div>
      <h1>运营工作台</h1>
      <p>聚合查看用户、域名、内容与客户服务状态，优先处理草稿和待回复留言。</p>
    </div>
    <div class="dashboard-hero__date" id="dashboard-date" aria-label="当前日期"></div>
  </header>

  <div id="dashboard-loading" class="dashboard-state" role="status">正在加载工作台数据…</div>
  <div id="dashboard-error" class="dashboard-state dashboard-state--error layui-hide" role="alert">
    <span id="dashboard-error-message">工作台数据加载失败</span>
    <button id="dashboard-retry" type="button" class="layui-btn layui-btn-primary layui-btn-sm">重新加载</button>
  </div>

  <section class="dashboard-metrics" aria-label="业务指标">
    <article class="dashboard-metric"><div class="dashboard-metric__label" data-metric-label>普通用户</div><div class="dashboard-metric__value" data-metric="userCount">0</div></article>
    <article class="dashboard-metric"><div class="dashboard-metric__label" data-metric-label>顶级域名</div><div class="dashboard-metric__value" data-metric="tldCount">0</div></article>
    <article class="dashboard-metric"><div class="dashboard-metric__label" data-metric-label>二级保留域名</div><div class="dashboard-metric__value" data-metric="sldCount">0</div></article>
    <article class="dashboard-metric dashboard-metric--attention"><div class="dashboard-metric__label" data-metric-label>博客草稿</div><div class="dashboard-metric__value" data-metric="draftPostCount">0</div></article>
    <article class="dashboard-metric dashboard-metric--success"><div class="dashboard-metric__label" data-metric-label>已发布文章</div><div class="dashboard-metric__value" data-metric="publishedPostCount">0</div></article>
    <article class="dashboard-metric dashboard-metric--attention"><div class="dashboard-metric__label" data-metric-label>待处理留言</div><div class="dashboard-metric__value" data-metric="pendingContactCount">0</div></article>
  </section>

  <div class="dashboard-grid">
    <main>
      <section class="dashboard-card">
        <div class="dashboard-card__header"><h2>最近文章</h2><a class="dashboard-card__link" lay-href="blog/list">管理文章</a></div>
        <div id="dashboard-recent-posts" class="dashboard-list"></div>
        <div id="dashboard-empty-posts" class="dashboard-empty layui-hide">暂无文章</div>
      </section>
      <section class="dashboard-card">
        <div class="dashboard-card__header"><h2>最近留言</h2><a class="dashboard-card__link" lay-href="contact/list">查看全部</a></div>
        <div id="dashboard-recent-contacts" class="dashboard-list"></div>
        <div id="dashboard-empty-contacts" class="dashboard-empty layui-hide">暂无联系消息</div>
      </section>
    </main>

    <aside>
      <section class="dashboard-card">
        <div class="dashboard-card__header"><h2>待办提醒</h2></div>
        <div class="dashboard-attention">
          <div class="dashboard-attention__count" data-pending-contact-count>0</div>
          <p>条联系消息等待处理。及时回复有助于保持良好的访客体验。</p>
          <button type="button" class="layui-btn layui-btn-sm" lay-href="contact/list">处理留言</button>
        </div>
      </section>
      <section class="dashboard-card">
        <div class="dashboard-card__header"><h2>快捷入口</h2></div>
        <nav class="dashboard-quick" aria-label="后台快捷入口">
          <a class="dashboard-quick__link" data-quick-link lay-href="person/list"><span class="dashboard-quick__icon layui-icon layui-icon-user"></span>用户管理</a>
          <a class="dashboard-quick__link" data-quick-link lay-href="domain/tld/index"><span class="dashboard-quick__icon layui-icon layui-icon-website"></span>顶级域名</a>
          <a class="dashboard-quick__link" data-quick-link lay-href="domain/sld/index"><span class="dashboard-quick__icon layui-icon layui-icon-link"></span>二级保留域名</a>
          <a class="dashboard-quick__link" data-quick-link lay-href="blog/list"><span class="dashboard-quick__icon layui-icon layui-icon-read"></span>博客文章</a>
          <a class="dashboard-quick__link" data-quick-link lay-href="contact/list"><span class="dashboard-quick__icon layui-icon layui-icon-dialogue"></span>联系消息</a>
        </nav>
      </section>
    </aside>
  </div>
</div>

<div id="dashboard-post-template" class="layui-hide">
  <article class="dashboard-list__item">
    <div><div class="dashboard-list__title" data-field="title"></div><div class="dashboard-list__meta"><span data-field="updatedAtText"></span><span class="dashboard-status" data-field="status"></span></div></div>
    <a class="dashboard-card__link" lay-href="blog/list">查看</a>
  </article>
</div>
<div id="dashboard-contact-template" class="layui-hide">
  <article class="dashboard-list__item">
    <div><div class="dashboard-list__title" data-field="subject"></div><div class="dashboard-list__meta"><span data-field="name"></span><span data-field="createTimeText"></span></div></div>
    <span class="dashboard-status" data-field="status"></span>
  </article>
</div>

<script>
layui.use(['admin', 'util'], function(){
  var $ = layui.$;
  var admin = layui.admin;
  var requestInFlight = false;

  function safeText(value) {
    return layui.util.escape(value == null ? '' : String(value));
  }

  function setSafeText(root, field, value) {
    root.find('[data-field="' + field + '"]').html(safeText(value));
  }

  function toggle(selector, visible) {
    $(selector)[visible ? 'removeClass' : 'addClass']('layui-hide');
  }

  function number(value) {
    var parsed = Number(value);
    return Number.isFinite(parsed) && parsed >= 0 ? parsed : 0;
  }

  function renderMetrics(data) {
    ['userCount', 'tldCount', 'sldCount', 'draftPostCount', 'publishedPostCount', 'pendingContactCount'].forEach(function(key) {
      $('[data-metric="' + key + '"]').text(number(data[key]));
    });
    $('[data-pending-contact-count]').text(number(data.pendingContactCount));
  }

  function renderPosts(items) {
    var list = $('#dashboard-recent-posts').empty();
    var posts = Array.isArray(items) ? items : [];
    toggle('#dashboard-empty-posts', posts.length === 0);
    posts.forEach(function(item) {
      var row = $('#dashboard-post-template').children().first().clone();
      setSafeText(row, 'title', item.title);
      setSafeText(row, 'updatedAtText', item.updatedAtText);
      var status = row.find('[data-field="status"]');
      status.html(safeText(Number(item.status) === 1 ? '已发布' : '草稿'));
      status.addClass(Number(item.status) === 1 ? 'dashboard-status--active' : 'dashboard-status--attention');
      list.append(row);
    });
  }

  function renderContacts(items) {
    var list = $('#dashboard-recent-contacts').empty();
    var contacts = Array.isArray(items) ? items : [];
    toggle('#dashboard-empty-contacts', contacts.length === 0);
    contacts.forEach(function(item) {
      var row = $('#dashboard-contact-template').children().first().clone();
      setSafeText(row, 'name', item.name);
      setSafeText(row, 'subject', item.subject);
      setSafeText(row, 'createTimeText', item.createTimeText);
      var status = row.find('[data-field="status"]');
      status.html(safeText(Number(item.status) === 1 ? '待处理' : '已处理'));
      status.addClass(Number(item.status) === 1 ? 'dashboard-status--attention' : 'dashboard-status--active');
      list.append(row);
    });
  }

  function showFailure(response) {
    var message = response && response.msg ? safeText(response.msg) : '工作台数据加载失败，请稍后重试';
    $('#dashboard-error-message').html(message);
    toggle('#dashboard-error', true);
  }

  function loadSummary() {
    if (requestInFlight) {
      return;
    }
    requestInFlight = true;
    $('#dashboard-retry').prop('disabled', true).addClass('layui-disabled');
    toggle('#dashboard-loading', true);
    toggle('#dashboard-error', false);
    admin.req({
      type: 'get',
      url: '/dashboard/summary',
      success: function(response) {
        if (!response || response.code !== 0 || !response.data) {
          showFailure(response);
          return;
        }
        renderMetrics(response.data);
        renderPosts(response.data.recentPosts);
        renderContacts(response.data.recentContacts);
      },
      error: function() {
        showFailure(null);
      },
      complete: function() {
        requestInFlight = false;
        $('#dashboard-retry').prop('disabled', false).removeClass('layui-disabled');
        toggle('#dashboard-loading', false);
      }
    });
  }

  $(document)
    .off('click.wesiteDashboard', '#dashboard-retry')
    .on('click.wesiteDashboard', '#dashboard-retry', loadSummary);
  $('#dashboard-date').text(new Intl.DateTimeFormat('zh-CN', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
  }).format(new Date()));
  loadSummary();
});
</script>
