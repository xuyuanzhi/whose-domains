#server
server.port=8082
server.servlet.context-path=/
server.tomcat.threads.max=24
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=30
server.tomcat.max-connections=256
server.tomcat.connection-timeout=5000

#database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/cangliu?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&autoreconnect=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

#hikari connection pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000

#maxmind GeoIP2 database paths
maxmind.city.file.path=C:/Users/Yuz/IdeaProjects/commerce-java/commerce-core/src/main/resources/GeoLite2-City.mmdb
maxmind.asn.file.path=C:/Users/Yuz/Downloads/GeoLite2-ASN_20251118.tar/GeoLite2-ASN_20251118/GeoLite2-ASN.mmdb

#redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=3000

#jwt (must match wesite-web)
app.jwt.secret=arwtewrgegsdgswer234234234sdfsdf
app.jwt.issuer=system

#gzip compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

#static resource cache
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true

#logging
logging.level.root=WARN
logging.level.info.wesite=INFO
logging.level.org.springframework.web=WARN

#OpenAPI documentation is available only in development.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
