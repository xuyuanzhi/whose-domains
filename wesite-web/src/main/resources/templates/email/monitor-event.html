<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring alert</title>
</head>
<body style="margin:0;padding:32px;background:#f4f6f9;font-family:Arial,sans-serif;color:#202938;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background:#fff;border:1px solid #e5e9f0;border-radius:12px;">
          <tr>
            <td style="padding:24px 32px;background:#0d1117;color:#fff;border-radius:12px 12px 0 0;">
              <strong style="color:#64ffda;">Whose.Domains</strong>
              <span style="margin-left:8px;color:#aab4c3;">Monitoring alert</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 8px;font-size:12px;color:#667085;text-transform:uppercase;"
                 th:text="${event.eventType}">EVENT</p>
              <h1 style="margin:0 0 16px;font-size:22px;line-height:1.35;"
                  th:text="${event.title}">A monitored value changed</h1>
              <p style="margin:0 0 20px;line-height:1.65;color:#475467;white-space:pre-wrap;"
                 th:text="${event.content}">Event details</p>
              <p style="margin:0 0 24px;font-size:13px;color:#98a2b3;"
                 th:text="${event.occurredAt}">2026-08-09 00:00 UTC</p>
              <a th:href="${event.targetUrl}"
                 style="display:inline-block;padding:11px 18px;border-radius:8px;background:#0d1117;color:#64ffda;text-decoration:none;font-weight:700;">
                Review monitoring details
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
