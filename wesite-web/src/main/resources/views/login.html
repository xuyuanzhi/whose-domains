<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-login-gateway>
<head th:replace="~{template::template_head}"></head>
<body>
<header th:replace="~{template::template_header}"></header>

<main class="login-gateway">
    <section class="login-gateway-card" aria-labelledby="loginGatewayTitle">
        <div class="login-gateway-heading">
            <p class="login-gateway-route"><span aria-hidden="true"></span> Protected account route</p>
            <h1 id="loginGatewayTitle">Sign In</h1>
            <p class="login-gateway-intro">Sign in to continue to your domain workspace, watchlists, and developer tools.</p>
        </div>

        <div class="login-gateway-method login-gateway-google" th:if="${_googleLoginEnabled}">
            <a class="login-gateway-google-button" th:href="@{/login/google(returnTo=${returnTo})}">
                <svg class="login-gateway-google-icon" aria-hidden="true" viewBox="0 0 18 18" focusable="false">
                    <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.702-1.567 2.684-3.874 2.684-6.614Z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/>
                    <path fill="#FBBC05" d="M3.963 10.706A5.41 5.41 0 0 1 3.682 9c0-.592.102-1.168.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.507.454 3.441 1.346l2.581-2.581C13.463.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"/>
                </svg>
                <span id="loginGatewayGoogleText">Continue with Google</span>
            </a>
            <div id="gatewayGoogleLoginMsg" role="status" aria-live="polite" aria-atomic="true" class="login-gateway-message"></div>
        </div>

        <div class="login-gateway-divider" th:if="${_googleLoginEnabled}"><span>or use email</span></div>

        <form id="loginGatewayEmailForm" class="login-gateway-method login-gateway-email">
            <label for="gatewayLoginEmail">Email address</label>
            <input id="gatewayLoginEmail" name="email" type="email" autocomplete="email" inputmode="email"
                   placeholder="you@example.com" required>
            <button id="loginGatewayEmailButton" type="submit">Email me a sign-in link</button>
            <p class="login-gateway-help">We’ll send a secure, password-free link to this address.</p>
            <div id="gatewayEmailLoginMsg" role="status" aria-live="polite" aria-atomic="true" class="login-gateway-message"></div>
        </form>

        <p class="login-gateway-footnote"><i class="fas fa-lock" aria-hidden="true"></i> Your sign-in link is single-use and expires automatically.</p>
    </section>
</main>

<footer th:replace="~{template::template_footer}"></footer>
<script th:inline="javascript">
(() => {
    const gateway = document.querySelector('.login-gateway-card');
    const form = gateway.querySelector('#loginGatewayEmailForm');
    const emailInput = form.querySelector('#gatewayLoginEmail');
    const submitButton = form.querySelector('#loginGatewayEmailButton');
    const returnTo = /*[[${returnTo}]]*/ '/user/watchlist?login=success';

    const loginMessages = {
        invalid: ['gatewayEmailLoginMsg', 'This sign-in link is invalid or has expired.', 'error'],
        google_error: ['gatewayGoogleLoginMsg', 'Google sign-in could not be completed. Please try again.', 'error'],
        google_invalid: ['gatewayGoogleLoginMsg', 'Google did not provide the account details required to sign in.', 'error'],
        google_unverified: ['gatewayGoogleLoginMsg', 'Your Google email address must be verified before signing in.', 'error'],
        google_conflict: ['gatewayGoogleLoginMsg', 'This account is already connected to another Google identity.', 'error'],
        google_inactive: ['gatewayGoogleLoginMsg', 'This account is not active.', 'error'],
        google_email_unavailable: ['gatewayGoogleLoginMsg', 'We could not send the email needed to confirm this account.', 'error'],
        google_expired: ['gatewayGoogleLoginMsg', 'This Google sign-in attempt has expired. Please try again.', 'error'],
        google_check_email: ['gatewayGoogleLoginMsg', 'Check your email to confirm this account before continuing.', 'success'],
        google_bind_required: ['gatewayGoogleLoginMsg', 'Email confirmed. Finish connecting your Google account.', 'success']
    };

    function setMessage(id, message, type) {
        const region = gateway.querySelector('#' + id);
        if (!region) return;
        region.textContent = message || '';
        region.className = 'login-gateway-message' + (type ? ' login-gateway-message--' + type : '');
    }

    const loginCode = new URLSearchParams(window.location.search).get('login');
    const callbackMessage = loginMessages[loginCode];
    if (callbackMessage) {
        if (loginCode === 'google_bind_required') {
            const googleText = gateway.querySelector('#loginGatewayGoogleText');
            if (googleText) googleText.textContent = 'Finish with Google';
        }
        setMessage(callbackMessage[0], callbackMessage[1], callbackMessage[2]);
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();
        const email = emailInput.value.trim();
        if (!email) {
            setMessage('gatewayEmailLoginMsg', 'Enter your email address to continue.', 'error');
            emailInput.focus();
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Sending link…';
        setMessage('gatewayEmailLoginMsg', '', '');
        try {
            const response = await fetch('/user/email-login', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email:email,returnTo:returnTo})
            });
            const body = await response.json();
            if (!response.ok || body.code !== 0) throw new Error(body.msg || 'Could not send the sign-in link.');
            setMessage('gatewayEmailLoginMsg', body.msg || 'Check your inbox for a sign-in link.', 'success');
        } catch (error) {
            setMessage('gatewayEmailLoginMsg', error.message || 'Network error. Try again.', 'error');
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = 'Email me a sign-in link';
        }
    });
})();
</script>
</body>
</html>
