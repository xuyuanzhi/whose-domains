#thymeleaf
spring.thymeleaf.prefix=classpath:/views/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

spring.messages.basename = i18n/message

spring.mvc.static-path-pattern=/static/**

# Honour forwarded headers only when they arrive from the configured reverse proxy.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.host-header=x-forwarded-host
server.tomcat.remoteip.port-header=x-forwarded-port
server.tomcat.remoteip.internal-proxies=${WESITE_TRUSTED_PROXY_REGEX:127\\.0\\.0\\.1|::1}

server.error.path=/error
server.error.whitelabel.enabled=false

spring.mvc.throw-exception-if-no-handler-found=true

#jwt
app.jwt.secret=${JWT_SECRET:please-change-this-default-secret-key-in-production}
app.jwt.issuer=system

# Public origin used in passwordless email links. Production overrides it with WESITE_PUBLIC_BASE_URL.
wesite.public-base-url=${WESITE_PUBLIC_BASE_URL:https://whose.domains}
wesite.seo.canonical-redirect-enabled=true
wesite.auth-cookie-secure=${WESITE_AUTH_COOKIE_SECURE:true}
wesite.google-login.enabled=${WESITE_GOOGLE_LOGIN_ENABLED:false}
wesite.google-login.client-id=${GOOGLE_CLIENT_ID:}
wesite.google-login.client-secret=${GOOGLE_CLIENT_SECRET:}
# Official PayPal Payment Link. Override with WESITE_SUPPORT_URL; an empty override hides the calls to action.
wesite.support.url=${WESITE_SUPPORT_URL:https://www.paypal.com/ncp/payment/LFWN7F5X9626W}

# Notification delivery schedules are rollout opt-ins. Monitoring and in-app notifications stay active.
wesite.notification-delivery.immediate-enabled=${WESITE_NOTIFICATION_DELIVERY_IMMEDIATE_ENABLED:false}
wesite.notification-delivery.digest-enabled=${WESITE_NOTIFICATION_DELIVERY_DIGEST_ENABLED:false}
wesite.retention.reporting-zone=${WESITE_RETENTION_REPORTING_ZONE:Asia/Shanghai}

# DeepSeek AI
ai.deepseek.api-key=${DEEPSEEK_API_KEY:}ai.deepseek.base-url=https://api.deepseek.com/v1
ai.deepseek.model=deepseek-v4-flash
ai.deepseek.max-tokens=4096
ai.deepseek.timeout-seconds=120

# Public MCP endpoint for AI clients (ChatGPT/Codex connector). Disabled unless enabled explicitly.
wesite.mcp.enabled=${WESITE_MCP_ENABLED:false}
wesite.mcp.endpoint=${WESITE_MCP_ENDPOINT:/mcp}
wesite.mcp.server-name=whose-domains
wesite.mcp.server-version=1.0.0
wesite.mcp.max-domains-per-batch=${WESITE_MCP_MAX_DOMAINS_PER_BATCH:10}
wesite.mcp.max-domains-per-batch-hard-limit=50
wesite.mcp.requests-per-minute=${WESITE_MCP_REQUESTS_PER_MINUTE:60}
wesite.mcp.daily-request-limit=${WESITE_MCP_DAILY_REQUEST_LIMIT:1000}

# OAuth 2.1 for the MCP endpoint (authorization server + bearer tokens). Off by default.
wesite.mcp.oauth.enabled=${WESITE_MCP_OAUTH_ENABLED:false}
wesite.mcp.oauth.issuer=${WESITE_MCP_OAUTH_ISSUER:https://whose.domains}
wesite.mcp.oauth.resource=${WESITE_MCP_OAUTH_RESOURCE:https://whose.domains/mcp}
wesite.mcp.oauth.client-id=${WESITE_MCP_OAUTH_CLIENT_ID:chatgpt}
wesite.mcp.oauth.client-secret=${WESITE_MCP_OAUTH_CLIENT_SECRET:}
wesite.mcp.oauth.scopes=${WESITE_MCP_OAUTH_SCOPES:domain.read}
wesite.mcp.oauth.redirect-uris=${WESITE_MCP_OAUTH_REDIRECT_URIS:}
wesite.mcp.oauth.require-consent=${WESITE_MCP_OAUTH_REQUIRE_CONSENT:false}
wesite.mcp.oauth.access-token-minutes=${WESITE_MCP_OAUTH_ACCESS_TOKEN_MINUTES:30}
wesite.mcp.oauth.jwk-file=${WESITE_MCP_OAUTH_JWK_FILE:}

# Enable only after applying doc/alter_issue_center.sql
wesite.diagnostics.enabled=${WESITE_DIAGNOSTICS_ENABLED:false}
wesite.diagnostics.app=web
wesite.diagnostics.environment=${WESITE_ENVIRONMENT:local}
