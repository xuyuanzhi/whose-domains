#thymeleaf
spring.thymeleaf.prefix=classpath:/views/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

spring.messages.basename = i18n/message

spring.mvc.static-path-pattern=/static/**

server.error.path=/error
server.error.whitelabel.enabled=false

spring.mvc.throw-exception-if-no-handler-found=true

#jwt
app.jwt.secret=${JWT_SECRET:please-change-this-default-secret-key-in-production}
app.jwt.issuer=system

# Public origin used in passwordless email links. Production overrides it with WESITE_PUBLIC_BASE_URL.
wesite.public-base-url=${WESITE_PUBLIC_BASE_URL:https://whose.domains}
wesite.seo.canonical-redirect-enabled=false
wesite.auth-cookie-secure=${WESITE_AUTH_COOKIE_SECURE:true}
wesite.google-login.enabled=${WESITE_GOOGLE_LOGIN_ENABLED:false}
wesite.google-login.client-id=${GOOGLE_CLIENT_ID:}
wesite.google-login.client-secret=${GOOGLE_CLIENT_SECRET:}

# Notification delivery schedules are rollout opt-ins. Monitoring and in-app notifications stay active.
wesite.notification-delivery.immediate-enabled=${WESITE_NOTIFICATION_DELIVERY_IMMEDIATE_ENABLED:false}
wesite.notification-delivery.digest-enabled=${WESITE_NOTIFICATION_DELIVERY_DIGEST_ENABLED:false}
wesite.retention.reporting-zone=${WESITE_RETENTION_REPORTING_ZONE:Asia/Shanghai}

# DeepSeek AI
ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.deepseek.base-url=https://api.deepseek.com/v1
ai.deepseek.model=deepseek-v4-flash
ai.deepseek.max-tokens=4096
ai.deepseek.timeout-seconds=120
